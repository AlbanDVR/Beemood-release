services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beemood}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beemood}
      POSTGRES_DB: ${POSTGRES_DB:-beemood}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-beemood}:${POSTGRES_PASSWORD:-beemood}@db:5432/${POSTGRES_DB:-beemood}"
    volumes:
      - ./back:/app
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 8080 --force"
    volumes:
      - ./front:/app
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  db_data: