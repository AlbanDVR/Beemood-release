stages:
  - build
  - deploy

variables:
  REGISTRY_URL: $CI_REGISTRY
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  GIT_SUBMODULE_STRATEGY: recursive

# Build backend image with Kaniko
build-backend:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.20.0-debug
    entrypoint: [""]
  tags:
    - kaniko
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/back"
      --dockerfile "./back/Dockerfile.prod"
      --destination "${CI_REGISTRY_IMAGE}/backend:${IMAGE_TAG}"
      --destination "${CI_REGISTRY_IMAGE}/backend:latest"
  only:
    - main

# Build frontend image with Kaniko
build-frontend:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.20.0-debug
    entrypoint: [""]
  tags:
    - kaniko
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/front"
      --dockerfile "./front/Dockerfile.prod"
      --destination "${CI_REGISTRY_IMAGE}/frontend:${IMAGE_TAG}"
      --destination "${CI_REGISTRY_IMAGE}/frontend:latest"
  only:
    - main

# Deploy to VPS (OVH)
deploy-vps:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client git
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - |
      ssh $VPS_USER@$VPS_HOST << 'ENDSSH'
        cd /home/milo/apps/docker/beemood

        # Pull latest code (with submodules)
        git pull origin main

        # Create/update .env file with secrets
        cat > dev.env << 'EOF'
        POSTGRES_USER=${POSTGRES_USER}
        POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        POSTGRES_DB=${POSTGRES_DB}
        SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
        SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
        SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI}
        JWT_SECRET_KEY=${JWT_SECRET_KEY}
        CI_REGISTRY_IMAGE=${CI_REGISTRY_IMAGE}
        EOF

        # Login to GitLab registry
        echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY

        # Pull latest images
        docker compose -f compose.prod.yaml pull

        # Stop and remove old containers
        docker compose -f compose.prod.yaml down

        # Start new containers
        docker compose -f compose.prod.yaml up -d

        # Clean up old images
        docker image prune -f
      ENDSSH
  environment:
    name: production
    url: http://$VPS_HOST
  only:
    - main
  needs:
    - build-backend
    - build-frontend