# Production compose file for VPS deployment
services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beemood}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beemood}
      POSTGRES_DB: ${POSTGRES_DB:-beemooddb}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - beemood-network

  backend:
    image: ${CI_REGISTRY_IMAGE}/backend:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-beemood}:${POSTGRES_PASSWORD:-beemood}@db:5432/${POSTGRES_DB:-beemood}"
    depends_on:
      - db
    ports:
      - "8003:8000"
    networks:
      - beemood-network

  frontend:
    image: ${CI_REGISTRY_IMAGE}/frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:8080"
    networks:
      - beemood-network

volumes:
  db_data:

networks:
  beemood-network:
    driver: bridge
